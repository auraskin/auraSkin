<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://auraskin.github.io/auraskin_website/" />
    <title>Redirecting to AuraSkin...</title>
    <script>
        // Preserve query parameters (like UTM tags) and hashes when redirecting
        const targetBaseUrl = "https://auraskin.github.io/auraskin_website/";
        const currentSearch = window.location.search; // e.g. "?utm_source=ig..."
        const currentHash = window.location.hash;     // e.g. "#contact"
        window.location.replace(targetBaseUrl + currentSearch + currentHash);
    </script>
</head>
<body>
    <p>Redirecting to our new website... If you are not redirected, <a href="https://auraskin.github.io/auraskin_website/">click here</a>.</p>
</body>
</html>
